<div class="auth-wrapper" [class.register-active]="!isLoginMode">
  <!-- Left panel (info + switch) -->
  <div class="auth-left">
    <div *ngIf="isLoginMode">
      <h2>Welcome Back!</h2>
      <p>To keep connected with us, please login with your personal info</p>
      <button class="ghost" (click)="isLoginMode=false">Sign Up</button>
    </div>
    <div *ngIf="!isLoginMode">
      <h2>Hello, Friend!</h2>
      <p>Enter your personal details and start your journey with us</p>
      <button class="ghost" (click)="isLoginMode=true">Sign In</button>
    </div>
  </div>

  <!-- Right panel (forms) -->
  <div class="auth-right">
    <!-- Sign In -->
    <form *ngIf="isLoginMode" (ngSubmit)="onLogin()">
      <h2>Sign In</h2>
      <input type="email" placeholder="Email" [(ngModel)]="loginData.email" name="loginEmail" required />
      <input type="password" placeholder="Password" [(ngModel)]="loginData.password" name="loginPassword" required />
      <button type="submit">Login</button>
    </form>

    <!-- Sign Up -->
    <form *ngIf="!isLoginMode" (ngSubmit)="onRegister()">
      <h2>Create Account</h2>
      <input type="text" placeholder="First Name" [(ngModel)]="registerData.first_name" name="registerFirstName" required />
      <input type="text" placeholder="Last Name" [(ngModel)]="registerData.last_name" name="registerLastName" required />
      <input type="email" placeholder="Email" [(ngModel)]="registerData.email" name="registerEmail" required />
      <input type="password" placeholder="Password" [(ngModel)]="registerData.password" name="registerPassword" required />

      <!-- Checkbox: Specialist -->
      <label class="checkbox-wrapper">
        <input type="checkbox" [(ngModel)]="registerData.specialist" name="registerSpecialist" />
        <span class="checkbox-custom" aria-hidden="true"></span>
        <span class="checkbox-label">I am a specialist</span>
      </label>

      <button type="submit">Sign Up</button>
    </form>
  </div>
</div>
