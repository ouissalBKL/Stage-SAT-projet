
<!-- Header avec nom utilisateur -->
<header class="professional-header">
  <div class="header-inner" style="display:flex;align-items:center;width:100%;padding:0.5em 1.5em 0.5em 0.7em;">
    <div class="logo-title" style="display:flex;align-items:center;gap:1em;flex-grow:1;">
      <div class="logo-container" tabindex="0" title="{{userName}}" style="cursor: pointer;">
        <i class="fas fa-user-circle" style="font-size: 32px; color: #1976d2;"></i>
      </div>
      <h1 style="margin:0;font-size:1.45em;letter-spacing:0.01em;">Assistant Approvisionnement</h1>
    </div>
  </div>
</header>

<!-- Container des messages -->
<div class="container" #messagesContainer>
  <div 
    *ngFor="let message of messages" 
    class="message"
    [class.user]="message.isUser"
    [class.bot]="!message.isUser"
  >
    <div [innerHTML]="formatMessage(message.content)"></div>
    <button 
      *ngIf="!message.isUser" 
      class="copy-btn" 
      (click)="copyToClipboard(message.content)"
    >
      Copier
    </button>
  </div>
</div>

<!-- Zone de saisie -->
<div class="input-container">
  <textarea 
    #questionInput
    [(ngModel)]="question"
    (keydown)="onKeyDown($event)"
    placeholder="Écris ta question ici..."
    [disabled]="isLoading"
  ></textarea>
  <button 
    class="send-btn" 
    (click)="askQuestion()" 
    [disabled]="isLoading || !question.trim()"
    aria-label="Envoyer la question"
  >
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
    </svg>
  </button>
</div>
